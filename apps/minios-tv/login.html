<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1424"><title>Acceso · MiniOS TV</title>
<style>
:root{color-scheme:dark;--bg:#080d17;--panel:#111e30;--line:#2b405b;--text:#f4f7fb;--muted:#a2b2c6;--accent:#70e1c6}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 70% 0,#1d4960aa,transparent 40%),var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}
main{width:min(100%,440px);padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 60px #0008}
.brand{font-weight:950;letter-spacing:.12em}.brand span{color:var(--accent)}h1{margin:18px 0 6px;font-size:1.8rem}.muted{color:var(--muted)}label{display:block;margin:15px 0 6px;font-weight:700}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;background:#091321;color:var(--text);font:inherit}button{width:100%;padding:13px;margin-top:16px;border:0;border-radius:11px;background:var(--accent);color:#06201d;font-weight:900;font:inherit;cursor:pointer}.switch{background:transparent;color:var(--accent);border:1px solid var(--line)}#message{min-height:24px;color:#ffcf9a;font-size:.9rem}.hidden{display:none!important}.hint{font-size:.82rem;color:var(--muted)}
</style></head><body><main><div class="brand">MINI<span>OS</span> / TV</div><h1 id="title">Iniciar sesión</h1><p class="muted">Registrate o iniciá sesión para acceder a los canales.</p>
<form id="form"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="email" maxlength="254" required><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" minlength="12" maxlength="128" required><p id="passwordHint" class="hint hidden">Usá al menos 12 caracteres.</p><button id="submit" type="submit">Ingresar</button></form>
<button id="switch" class="switch" type="button">Crear una cuenta</button><p id="message" role="status" aria-live="polite"></p><p class="hint">Las cuentas nuevas tienen permisos de usuario. El acceso de administración se asigna por separado y nunca desde este formulario.</p></main>
<script>
(()=>{const $=id=>document.getElementById(id);let mode="login";function setMode(next){mode=next;$("title").textContent=mode==="login"?"Iniciar sesión":"Crear cuenta";$("submit").textContent=mode==="login"?"Ingresar":"Registrarme";$("switch").textContent=mode==="login"?"Crear una cuenta":"Ya tengo una cuenta";$("password").autocomplete=mode==="login"?"current-password":"new-password";$("passwordHint").classList.toggle("hidden",mode==="login");$("password").minLength=mode==="login"?1:12;$("message").textContent="";}
$("switch").onclick=()=>setMode(mode==="login"?"register":"login");
$("form").onsubmit=async e=>{e.preventDefault();$("submit").disabled=true;$("message").textContent="Comprobando…";try{const r=await fetch("/api/auth/"+mode,{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value,password:$("password").value})});const data=await r.json();if(!r.ok)throw new Error(data.error==="rate_limited"?"Demasiados intentos. Esperá 15 minutos.":data.error==="invalid_credentials"?"Correo o contraseña incorrectos.":data.error==="registration_unavailable"?"No se pudo crear la cuenta con esos datos.":data.error==="invalid_email_or_password"?"Revisá el correo y usá una contraseña de al menos 12 caracteres.":"No se pudo completar la operación.");location.replace("/apps/minios-tv/");}catch(err){$("message").textContent=err.message||"Error de conexión.";}finally{$("submit").disabled=false;}};
fetch("/api/auth/me",{credentials:"same-origin"}).then(r=>{if(r.ok)location.replace("/apps/minios-tv/");}).catch(()=>{});
})();
</script></body></html>
