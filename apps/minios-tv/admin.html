<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MiniOS TV · Administración</title>
<style>body{margin:0;padding:24px;background:#080d17;color:#f4f7fb;font:16px system-ui}main{max-width:1000px;margin:auto}.panel{padding:18px;margin:16px 0;background:#111e30;border:1px solid #2b405b;border-radius:16px}button,input,select{font:inherit;padding:10px;margin:4px;border-radius:9px;border:1px solid #2b405b;background:#091321;color:#f4f7fb}button{cursor:pointer}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #2b405b}</style></head>
<body><main><h1>MiniOS TV · Administración</h1><p>Las acciones administrativas se autorizan nuevamente en el servidor.</p><button id="logout">Cerrar sesión</button>
<section class="panel"><h2>Usuarios</h2><div id="users">Cargando…</div></section>
<section class="panel"><h2>Canales administrados</h2><form id="channel"><input id="name" placeholder="Nombre del canal" required><input id="country" placeholder="País"><select id="category"><option>general</option><option>sports</option><option>news</option><option>entertainment</option></select><input id="source" type="url" placeholder="URL HTTPS oficial" required><button>Agregar</button></form><div id="channels">Cargando…</div></section><p id="status" role="status"></p></main>
<script>
(()=>{const $=id=>document.getElementById(id);const esc=x=>String(x||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));async function api(path,opt={}){const r=await fetch("/api/admin/"+path,{credentials:"same-origin",...opt,headers:{"Content-Type":"application/json",...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Operación rechazada");return d;}
async function load(){const [u,c]=await Promise.all([api("users"),api("channels")]);$("users").innerHTML="<table><tr><th>Correo</th><th>Rol</th><th>Estado</th><th></th></tr>"+u.users.map(x=>"<tr><td>"+esc(x.email)+"</td><td>"+esc(x.role)+"</td><td>"+esc(x.status)+"</td><td>"+(x.role==="admin"?"—":'<button data-user="'+esc(x.id)+'" data-status="'+(x.status==="active"?"suspended":"active")+'">'+(x.status==="active"?"Suspender":"Activar")+"</button>")+"</td></tr>").join("")+"</table>";$("channels").innerHTML="<table><tr><th>Canal</th><th>País</th><th>Tipo</th><th>Activo</th><th></th></tr>"+c.channels.map(x=>"<tr><td>"+esc(x.name)+"</td><td>"+esc(x.country)+"</td><td>"+esc(x.category)+"</td><td>"+(x.enabled?"Sí":"No")+'</td><td><button data-channel="'+esc(x.id)+'">Eliminar</button></td></tr>').join("")+"</table>";}
$("users").onclick=async e=>{const b=e.target.closest("[data-user]");if(!b)return;try{await api("users/"+encodeURIComponent(b.dataset.user),{method:"PATCH",body:JSON.stringify({status:b.dataset.status})});await load();}catch(x){$("status").textContent=x.message;}};
$("channels").onclick=async e=>{const b=e.target.closest("[data-channel]");if(!b||!confirm("¿Eliminar el canal?"))return;try{await api("channels/"+encodeURIComponent(b.dataset.channel),{method:"DELETE"});await load();}catch(x){$("status").textContent=x.message;}};
$("channel").onsubmit=async e=>{e.preventDefault();try{await api("channels",{method:"POST",body:JSON.stringify({name:$("name").value,country:$("country").value,category:$("category").value,source:$("source").value})});e.target.reset();await load();}catch(x){$("status").textContent=x.message;}};
$("logout").onclick=async()=>{await fetch("/api/auth/logout",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:"{}"});location.replace("/apps/minios-tv/login.html");};
fetch("/api/auth/me",{credentials:"same-origin"}).then(r=>{if(!r.ok)throw Error();return r.json();}).then(d=>{if(d.user.role!=="admin")throw Error();load().catch(e=>$("status").textContent=e.message);}).catch(()=>location.replace("/apps/minios-tv/login.html"));
})();
</script></body></html>
